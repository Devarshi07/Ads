[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theraflo-ads"
version = "0.2.0"
description = "Theraflo Ads: safety-first ads decisioning platform (prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "prometheus-client>=0.20",
    # The dev console's demo traffic (and scripts/demo_traffic.py).
    "httpx>=0.27",
]

[project.optional-dependencies]
# Postgres, Redis, RabbitMQ adapters (Milestone 2).
infra = [
    "sqlalchemy>=2.0.30",
    # Pure-Python driver: no native DLL, so it also runs under Windows Application Control.
    "pg8000>=1.31",
    "alembic>=1.13",
    "redis>=5.0",
    "pika>=1.3",
]
ml = ["lightgbm>=4.5"]
mlops = ["mlflow>=2.16", "dvc>=3.50"]
llm = ["anthropic>=1.11,<2"]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "fakeredis[lua]>=2.23",
    "bandit[toml]>=1.7",
]
all = ["theraflo-ads[infra,ml,mlops,llm,dev]"]

[project.scripts]
theraflo-ads = "theraflo_ads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
theraflo_ads = [
    "infra/migrations/*.ini",
    "infra/migrations/**/*.py",
    "llm/prompts/*.md",
    "api/static/console/*.html",
    "api/static/console/css/*.css",
    "api/static/console/js/*.js",
    "api/static/console/js/pages/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs the docker-compose services (Postgres, Redis, RabbitMQ)",
]
filterwarnings = [
    # Starlette's TestClient nudges toward a different HTTP client; not actionable here.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
line-ending = "lf"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B311: `random` drives exploration, simulation, and retry jitter, never secrets.
# tests/test_security.py enforces that security and privacy code uses `secrets` instead.
skips = ["B311"]
