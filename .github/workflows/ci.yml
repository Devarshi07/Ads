# CI (design doc: Evals → "versioned in DVC, run in CI"; Security & Threat Model).
# Every change runs lint, unit tests, integration tests against real services, the
# offline eval gates, security scans, and an image build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install "ruff>=0.5"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[infra,ml,llm,dev]"
      - run: pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: theraflo, POSTGRES_PASSWORD: theraflo, POSTGRES_DB: theraflo_ads}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U theraflo" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env: {RABBITMQ_DEFAULT_USER: theraflo, RABBITMQ_DEFAULT_PASS: theraflo}
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[infra,ml,llm,dev]"
      - run: pytest -m integration

  evals:
    # Offline gates only: the simulated reviewer exercises the controls without API spend.
    # The live Claude eval (`review eval --reviewer anthropic --live`) runs on demand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[infra,ml,llm]"
      - name: creative-review eval gates
        run: |
          theraflo-ads review eval --reviewer simulated --out reports/review_eval.json
          python -c "import json,sys; r=json.load(open('reports/review_eval.json')); sys.exit(0 if r['passed'] else 1)"
      - name: simulator safety evals
        run: python -m theraflo_ads.simulator --users 800 --days 7
      - uses: actions/upload-artifact@v4
        with: {name: eval-reports, path: reports/}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[infra,ml,llm]" "bandit[toml]>=1.7" "pip-audit>=2.7"
      - name: static analysis (bandit)
        run: bandit -c pyproject.toml -r src
      - name: dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable

  alerts:
    # Rules parse, and each alert fires (or stays quiet) on synthetic series as specified.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" prom/prometheus:v2.54.1
          check config /etc/prometheus/prometheus.yml
      - name: promtool test rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" prom/prometheus:v2.54.1
          test rules /etc/prometheus/alerts_test.yml

  image:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: "theraflo-ads:ci"}
