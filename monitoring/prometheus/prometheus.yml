# Prometheus for the docker-compose stack (design doc: Monitoring, Alerting).
# In production, route alerts through Alertmanager to the on-call rotation.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: theraflo-ads-api
    metrics_path: /metrics
    # With THERAFLO_ADS_METRICS_TOKEN set on the API, mount the token and uncomment:
    # authorization:
    #   credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: theraflo-ads-review-worker
    # Creative reviews run in the worker, so their outcome counters live there.
    static_configs:
      - targets: ["review-worker:9100"]

  - job_name: rabbitmq
    # Per-queue metrics, so dead-letter queues can be alerted on individually.
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
